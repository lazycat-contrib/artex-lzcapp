version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/artex.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: artex
    bump: patch

build:
  run_buildscript: false

images:
  # 上游仅 latest 可变 tag（amd64 单架构）→ digest 比对 + patch 自增
  - id: artex
    target: service
    service: artex
    source: docker.io/tomicdd/artex
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ARTEXX
    summary: "AI 自主渗透测试系统"
